name: Build and Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'V*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '正式发布必填 Git 标签；测试签名可留空，使用所选分支'
        required: false
        type: string
      signing_mode:
        description: '测试签名只保存 Actions 产物；正式签名才发布 Release'
        required: true
        type: choice
        default: test-signing
        options:
          - test-signing
          - release-signing

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Build and Publish StarPie Release
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      SIGNING_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_mode || 'release-signing' }}
      SIGNPATH_ORGANIZATION_ID: a5196baf-a533-4b1e-aff8-be32f05fa7b3
      SIGNPATH_PROJECT_SLUG: StarPie

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate signing configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) {
            throw "Repository secret SIGNPATH_API_TOKEN is required; unsigned releases are not allowed."
          }
          if ($env:SIGNING_POLICY -notin @('test-signing', 'release-signing')) {
            throw "Unsupported signing policy: $env:SIGNING_POLICY"
          }
          if ($env:SIGNING_POLICY -eq 'release-signing' -and
              $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and
              [string]::IsNullOrWhiteSpace($env:REQUESTED_TAG)) {
            throw "A Git tag is required for a production release."
          }
          if ($env:SIGNING_POLICY -eq 'test-signing' -and
              [string]::IsNullOrWhiteSpace($env:REQUESTED_TAG)) {
            [xml]$project = Get-Content 'WinPieGestures/WinPieGestures.csproj'
            $version = [string]$project.Project.PropertyGroup.Version
            "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Verify tag points to latest commit of an allowed release branch
        if: ${{ env.SIGNING_POLICY == 'release-signing' }}
        shell: pwsh
        run: |
          # Release tags may only point to the current tip of main, dev-* or dev/**.
          # A tag push does not carry the source branch, so compare the tagged commit
          # with every remote branch that matches the allowed release-branch policy.
          git fetch origin "+refs/heads/*:refs/remotes/origin/*" --prune

          $tagCommit = (git rev-parse "$env:RELEASE_TAG^{commit}").Trim()
          $allowedBranches = @(
            git for-each-ref --format="%(refname:strip=3)" refs/remotes/origin |
              Where-Object { $_ -match '^(main|dev-.*|dev/.*)$' }
          )

          if ($allowedBranches.Count -eq 0) {
            throw "No release branches matched the allowed patterns: main, dev-* or dev/**"
          }

          $matchingBranches = [System.Collections.Generic.List[string]]::new()
          foreach ($branch in $allowedBranches) {
            $branchCommit = (git rev-parse "origin/$branch").Trim()
            if ($tagCommit -eq $branchCommit) {
              $matchingBranches.Add($branch)
            }
          }

          if ($matchingBranches.Count -eq 0) {
            $allowedTips = @($allowedBranches | ForEach-Object {
              $branchCommit = (git rev-parse "origin/$_").Trim()
              "$_=$branchCommit"
            })
            throw @"
          Release tag must point to the latest commit of an allowed release branch.
          Allowed branches: main, dev-* or dev/**
          Tag=$tagCommit
          Allowed branch tips:
          $($allowedTips -join [Environment]::NewLine)
          "@
          }

          Write-Host "Verified release commit: $tagCommit"
          Write-Host "Matching release branch(es): $($matchingBranches -join ', ')"
      - name: Verify compiled version fields
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -inotmatch '^v(?<baseVersion>\d+\.\d+\.\d+)(?<prerelease>-beta\.\d+)?$') {
            throw "Release tag must use vX.Y.Z/VX.Y.Z or vX.Y.Z-beta.N/VX.Y.Z-beta.N format: $tag"
          }

          $baseVersion = $Matches.baseVersion
          [xml]$project = Get-Content "WinPieGestures/WinPieGestures.csproj"

          $projectVersion = [string]$project.Project.PropertyGroup.Version
          $assemblyVersion = [string]$project.Project.PropertyGroup.AssemblyVersion
          $fileVersion = [string]$project.Project.PropertyGroup.FileVersion

          function Get-ThreePartVersion([string]$value, [string]$fieldName) {
            if ($value -notmatch '^(?<baseVersion>\d+\.\d+\.\d+)(?:[.+-].*)?$') {
              throw "$fieldName must start with a three-part numeric version: $value"
            }

            return $Matches.baseVersion
          }

          $versionFields = @(
            @{ Name = "Version"; Value = $projectVersion }
            @{ Name = "AssemblyVersion"; Value = $assemblyVersion }
            @{ Name = "FileVersion"; Value = $fileVersion }
          )

          foreach ($field in $versionFields) {
            $fieldBaseVersion = Get-ThreePartVersion $field.Value $field.Name
            if ($fieldBaseVersion -ne $baseVersion) {
              throw "$($field.Name) mismatch: tag base=$baseVersion actual=$($field.Value)"
            }
          }

          Write-Host "Verified matching three-part version ${baseVersion}: Version=$projectVersion AssemblyVersion=$assemblyVersion FileVersion=$fileVersion"

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore WinPieGestures/WinPieGestures.csproj -r win-x64

      - name: Build Release
        run: dotnet build WinPieGestures/WinPieGestures.csproj -c Release --no-restore

      - name: Publish Lightweight package
        run: >
          dotnet publish WinPieGestures/WinPieGestures.csproj
          -c Release
          -r win-x64
          --no-self-contained
          --no-restore
          -o publish/Lightweight

      - name: Publish Standalone package
        run: >
          dotnet publish WinPieGestures/WinPieGestures.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/Standalone

      - name: Prepare single-file signing inputs and verification helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'signing/unsigned' | Out-Null
          # Non-archived uploads can ignore artifact names. Unique basenames avoid
          # collisions between the two StarPie.exe files within the same run.
          Copy-Item -LiteralPath 'publish/Lightweight/StarPie.exe' -Destination 'signing/unsigned/StarPie-Lightweight.exe'
          Copy-Item -LiteralPath 'publish/Standalone/StarPie.exe' -Destination 'signing/unsigned/StarPie-Standalone.exe'

          @'
          param(
            [Parameter(Mandatory)][string]$SignedDirectory,
            [Parameter(Mandatory)][string]$Destination
          )
          $ErrorActionPreference = 'Stop'
          if ($env:SIGNING_POLICY -notin @('test-signing', 'release-signing')) {
            throw "Unsupported signing policy: $env:SIGNING_POLICY"
          }
          $files = @(Get-ChildItem -LiteralPath $SignedDirectory -File)
          if ($files.Count -ne 1 -or $files[0].Extension -ne '.exe') {
            throw "Expected exactly one signed executable in $SignedDirectory."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $files[0].FullName
          if ($null -eq $signature.SignerCertificate) {
            throw "Signed artifact has no signer certificate: $($files[0].Name)"
          }
          $signerFile = 'signing/signer-thumbprint.txt'
          $thumbprint = $signature.SignerCertificate.Thumbprint
          if ([string]::IsNullOrWhiteSpace($thumbprint)) {
            throw 'Signed artifact has no signer certificate thumbprint.'
          }
          if ((Test-Path -LiteralPath $signerFile) -and
              (Get-Content -LiteralPath $signerFile -Raw).Trim() -ne $thumbprint) {
            throw 'All release executables must use the same signing certificate.'
          }

          $rootStore = $null
          $addedTestCertificate = $false
          $testCertificate = $null
          try {
            if ($env:SIGNING_POLICY -eq 'test-signing') {
              # Never change the trust store on a developer PC or a persistent runner.
              if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
                throw 'Temporary test certificate trust is restricted to GitHub-hosted Actions runners.'
              }
              $testCertificate = $signature.SignerCertificate
              if ($testCertificate.Subject -ne $testCertificate.Issuer) {
                throw 'The test-signing policy must use a self-signed test certificate.'
              }
              $rootStore = New-Object -TypeName System.Security.Cryptography.X509Certificates.X509Store -ArgumentList @(
                [System.Security.Cryptography.X509Certificates.StoreName]::Root,
                [System.Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser
              )
              $rootStore.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
              $alreadyTrusted = @($rootStore.Certificates | Where-Object { $_.Thumbprint -eq $thumbprint }).Count -gt 0
              if (-not $alreadyTrusted) {
                # Mark ownership before Add so even a partially failed import is cleaned up.
                $addedTestCertificate = $true
                $rootStore.Add($testCertificate)
                Write-Host "Temporarily trusted test signer $thumbprint on the ephemeral runner."
              }
              # An untrusted root can surface as UnknownError. Re-verify after establishing
              # explicit test trust rather than accepting UnknownError or NotTrusted.
              $signature = Get-AuthenticodeSignature -LiteralPath $files[0].FullName
              if ($null -eq $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ne $thumbprint) {
                throw 'Signer certificate changed during signature verification.'
              }
            }
            if ([string]$signature.Status -ne 'Valid') {
              throw "Signature verification failed: $($signature.Status) - $($signature.StatusMessage)"
            }
            if ($env:SIGNING_POLICY -eq 'release-signing' -and $null -eq $signature.TimeStamperCertificate) {
              throw 'Production signatures must include a trusted timestamp.'
            }
            # Native verification checks the embedded signature and Windows trust policy
            # for both modes. Only production requires a timestamp; test trust is temporary.
            $signTool = Get-Command signtool.exe -ErrorAction SilentlyContinue
            $signToolPath = if ($null -ne $signTool) { $signTool.Source } else {
              $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
              Get-ChildItem -LiteralPath $sdkBin -Filter signtool.exe -File -Recurse |
                Where-Object { $_.Directory.Name -eq 'x64' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if ([string]::IsNullOrWhiteSpace($signToolPath)) {
              throw 'Windows SDK SignTool is required for signature verification.'
            }
            $verifyArguments = @('verify', '/pa', '/all')
            if ($env:SIGNING_POLICY -eq 'release-signing') {
              $verifyArguments += '/tw'
            }
            & $signToolPath @verifyArguments $files[0].FullName
            if ($LASTEXITCODE -ne 0) {
              throw "SignTool trust verification failed with exit code $LASTEXITCODE."
            }
          } finally {
            if ($null -ne $rootStore) {
              try {
                if ($addedTestCertificate) {
                  $rootStore.Remove($testCertificate)
                  Write-Host "Removed temporary test signer $thumbprint."
                }
              } finally {
                $rootStore.Dispose()
              }
            }
          }
          if (-not (Test-Path -LiteralPath $signerFile)) {
            $thumbprint | Set-Content -LiteralPath $signerFile -Encoding utf8
          }
          Copy-Item -LiteralPath $files[0].FullName -Destination $Destination -Force
          Write-Host "Verified $Destination ($($signature.Status)); signer=$thumbprint"
          '@ | Set-Content -LiteralPath 'signing/Install-VerifiedSignedArtifact.ps1' -Encoding utf8

      - name: Upload unsigned Lightweight executable
        id: upload-lightweight
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-lightweight-${{ github.run_id }}-${{ github.run_attempt }}
          path: signing/unsigned/StarPie-Lightweight.exe
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Sign Lightweight executable with SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNING_POLICY }}
          github-artifact-id: ${{ steps.upload-lightweight.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          skip-decompress: true
          output-artifact-directory: signing/signed/Lightweight

      - name: Verify and install signed Lightweight executable
        shell: pwsh
        run: |
          & ./signing/Install-VerifiedSignedArtifact.ps1 `
            -SignedDirectory 'signing/signed/Lightweight' `
            -Destination 'publish/Lightweight/StarPie.exe'

      - name: Upload unsigned Standalone executable
        id: upload-standalone
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-standalone-${{ github.run_id }}-${{ github.run_attempt }}
          path: signing/unsigned/StarPie-Standalone.exe
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Sign Standalone executable with SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNING_POLICY }}
          github-artifact-id: ${{ steps.upload-standalone.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          skip-decompress: true
          output-artifact-directory: signing/signed/Standalone

      - name: Verify and install signed Standalone executable
        shell: pwsh
        run: |
          & ./signing/Install-VerifiedSignedArtifact.ps1 `
            -SignedDirectory 'signing/signed/Standalone' `
            -Destination 'publish/Standalone/StarPie.exe'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Inno Setup Installer
        id: build-installer
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $tagClean = $tag.TrimStart('v', 'V')
          $outputBaseFilename = "StarPie-$tag-Setup-win-x64"

          $numericVersion = ($tagClean -replace '-.*$', '')
          $versionParts = @($numericVersion.Split('.'))
          while ($versionParts.Count -lt 4) {
            $versionParts += "0"
          }
          $quadVersion = ($versionParts[0..3] -join '.')

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          & iscc.exe `
            "/DMyAppVersion=$tagClean" `
            "/DMyAppNumericVersion=$quadVersion" `
            "/DSourceDir=$PWD\publish\Standalone" `
            "/DOutputDir=$PWD\dist" `
            "/DOutputBaseFilename=$outputBaseFilename" `
            "installer\StarPie.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

          if (-not (Test-Path "dist\$outputBaseFilename.exe")) {
            throw "Expected installer binary dist\$outputBaseFilename.exe was not found!"
          }
          Write-Host "Successfully generated Inno Setup installer: dist\$outputBaseFilename.exe"
          "artifact-path=dist/$outputBaseFilename.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload unsigned installer executable
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.build-installer.outputs.artifact-path }}
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Sign installer executable with SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNING_POLICY }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          skip-decompress: true
          output-artifact-directory: signing/signed/Installer

      - name: Verify and install signed installer executable
        shell: pwsh
        run: |
          & ./signing/Install-VerifiedSignedArtifact.ps1 `
            -SignedDirectory 'signing/signed/Installer' `
            -Destination "dist/StarPie-$env:RELEASE_TAG-Setup-win-x64.exe"

      - name: Package release assets
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          $lightweightArchive = "dist/StarPie-$tag-Lightweight-win-x64.zip"
          $standaloneArchive = "dist/StarPie-$tag-Standalone-win-x64.zip"

          Compress-Archive -Path "publish/Lightweight/*" -DestinationPath $lightweightArchive -Force
          Compress-Archive -Path "publish/Standalone/*" -DestinationPath $standaloneArchive -Force

          $checksums = Get-ChildItem "dist/*.zip", "dist/*.exe" | Sort-Object Name | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
          }
          $checksums | Set-Content "dist/SHA256SUMS.txt" -Encoding utf8

          if (-not (Test-Path "publish/Lightweight/StarPie.exe")) {
            throw "Lightweight package does not contain StarPie.exe"
          }
          if (-not (Test-Path "publish/Standalone/StarPie.exe")) {
            throw "Standalone package does not contain StarPie.exe"
          }

      - name: Save test-signed packages (not for distribution)
        if: ${{ env.SIGNING_POLICY == 'test-signing' }}
        uses: actions/upload-artifact@v7
        with:
          name: TEST-SIGNED-DO-NOT-DISTRIBUTE-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Summarize test signing
        if: ${{ env.SIGNING_POLICY == 'test-signing' }}
        shell: pwsh
        run: |
          @'
          ## SignPath test signing completed
          Lightweight, Standalone and Setup were signed with the test-signing policy.
          These artifacts use a test certificate and must not be distributed as a production release.
          No GitHub Release was created or deleted. Request SignPath's configuration review before production signing.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Extract Release Notes from CHANGELOG.md
        if: ${{ env.SIGNING_POLICY == 'release-signing' }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $tagClean = $tag.TrimStart('v', 'V')
          $changelogPath = "CHANGELOG.md"
          $notes = ""

          if (Test-Path $changelogPath) {
            $content = Get-Content $changelogPath -Raw -Encoding utf8
            # 优先匹配当前 Tag: ## [vX.Y.Z-beta.N] 或 ## [vX.Y.Z]
            $pattern = "(?s)##\s*\[[vV]?$([regex]::Escape($tagClean))\][^\r\n]*\r?\n(.*?)(?=\r?\n##\s*\[|\Z)"
            if ($content -match $pattern) {
              $notes = $Matches[1].Trim()
            }
            # 若未匹配到，提取顶部第一个版本段落
            if ([string]::IsNullOrWhiteSpace($notes)) {
              $firstPattern = "(?s)##\s*\[[vV]?[^\]]+\][^\r\n]*\r?\n(.*?)(?=\r?\n##\s*\[|\Z)"
              if ($content -match $firstPattern) {
                $notes = $Matches[1].Trim()
              }
            }
          }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $notesFile = "dist/RELEASE_NOTES.md"
          if (-not [string]::IsNullOrWhiteSpace($notes)) {
            $notes | Set-Content $notesFile -Encoding utf8
            Write-Host "Successfully extracted release notes from CHANGELOG.md for $tag"
          } else {
            "StarPie $tag" | Set-Content $notesFile -Encoding utf8
          }

      - name: Create GitHub Release
        if: ${{ env.SIGNING_POLICY == 'release-signing' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem "dist/*.zip", "dist/*.exe", "dist/SHA256SUMS.txt" |
            Sort-Object Name |
            Select-Object -ExpandProperty FullName

          $releaseArguments = @("release", "create", $env:RELEASE_TAG)
          $releaseArguments += $assets
          $releaseArguments += @("--verify-tag", "--title", "StarPie $env:RELEASE_TAG")

          $notesFile = "dist/RELEASE_NOTES.md"
          if (Test-Path $notesFile) {
            $releaseArguments += @("--notes-file", $notesFile)
          } else {
            $releaseArguments += @("--notes", "StarPie $env:RELEASE_TAG")
          }

          if ($env:RELEASE_TAG -imatch '^v\d+\.\d+\.\d+-beta\.\d+$') {
            $releaseArguments += "--prerelease"
            Write-Host "Publishing GitHub pre-release: $env:RELEASE_TAG"
          }

          & gh @releaseArguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed with exit code $LASTEXITCODE"
          }

      - name: Retain latest three beta releases
        if: ${{ env.SIGNING_POLICY == 'release-signing' && contains(env.RELEASE_TAG, '-beta.') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ($env:RELEASE_TAG -inotmatch '^v(?<baseVersion>\d+\.\d+\.\d+)-beta\.\d+$') {
            throw "Unexpected beta tag format: $env:RELEASE_TAG"
          }

          $baseVersion = $Matches.baseVersion
          $betaPattern = "^v$([regex]::Escape($baseVersion))-beta\.(?<number>\d+)$"
          $releaseJson = (& gh release list --repo $env:GH_REPO --limit 1000 --json tagName,isDraft,isPrerelease | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to list GitHub releases (exit code $LASTEXITCODE)"
          }

          $releases = @($releaseJson | ConvertFrom-Json)
          $betaReleases = [System.Collections.Generic.List[object]]::new()

          foreach ($release in $releases) {
            if ($release.isDraft -or -not $release.isPrerelease) {
              continue
            }

            $betaMatch = [regex]::Match($release.tagName, $betaPattern, [System.Text.RegularExpressions.RegexOptions]::IgnoreCase)
            if ($betaMatch.Success) {
              $betaReleases.Add([pscustomobject]@{
                TagName = $release.tagName
                Number = [long]$betaMatch.Groups['number'].Value
              })
            }
          }

          $orderedBetas = @($betaReleases | Sort-Object Number -Descending)
          $retainedBetas = @($orderedBetas | Select-Object -First 3)
          $expiredBetas = @($orderedBetas | Select-Object -Skip 3)

          Write-Host "Retaining beta releases: $($retainedBetas.TagName -join ', ')"
          if ($expiredBetas.Count -eq 0) {
            Write-Host "No superseded beta releases need to be deleted."
            exit 0
          }

          $failures = [System.Collections.Generic.List[string]]::new()
          foreach ($beta in $expiredBetas) {
            Write-Host "Deleting beta release $($beta.TagName); Git tag will be retained."
            & gh release delete $beta.TagName --repo $env:GH_REPO --yes
            if ($LASTEXITCODE -ne 0) {
              $failures.Add($beta.TagName)
            }
          }

          if ($failures.Count -gt 0) {
            throw "Failed to delete beta releases: $($failures -join ', ')"
          }
