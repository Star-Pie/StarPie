name: Sync Release to AtomGit

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已在 GitHub 发布的完整 Tag，例如 v2.0.0；也用于失败后重试'
        required: true
        type: string
      upload_client:
        description: '上传客户端；curl 用于与现有 node 方式对照，不保证提速'
        required: true
        type: choice
        default: curl
        options:
          - curl
          - node
      upload_timeout_minutes:
        description: '单个附件上传超时（分钟），正整数；留空不主动设置上传超时'
        required: false
        type: string
        default: ''
      job_timeout_minutes:
        description: '任务总超时（分钟），正整数；留空使用 360 分钟，托管 Runner 最多运行 6 小时'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      upload_client:
        required: false
        type: string
        default: curl
      upload_timeout_minutes:
        required: false
        type: string
        default: ''
      job_timeout_minutes:
        required: false
        type: string
        default: ''
    secrets:
      ATOMGIT_TOKEN:
        required: true

permissions:
  contents: read

# Serialize writes, including manual retries, without cancelling an active upload.
concurrency:
  group: atomgit-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror published release and verify assets
    runs-on: ubuntu-latest
    # Blank uses the platform default; GitHub-hosted jobs still have a 6-hour execution limit.
    timeout-minutes: ${{ fromJSON(format('{0}', inputs.job_timeout_minutes || 360)) }}
    steps:
      - name: Checkout synchronization code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check curl availability
        if: ${{ inputs.upload_client == 'curl' }}
        run: curl --version

      - name: Run offline synchronization tests
        run: node --test .github/scripts/sync-atomgit-release.test.mjs

      - name: Test curl transport on loopback only
        if: ${{ inputs.upload_client == 'curl' }}
        run: node --test .github/scripts/upload-with-curl.test.mjs

      - name: Synchronize published GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          UPLOAD_CLIENT: ${{ inputs.upload_client }}
          UPLOAD_TIMEOUT_MINUTES: ${{ inputs.upload_timeout_minutes }}
          JOB_TIMEOUT_MINUTES: ${{ inputs.job_timeout_minutes }}
          # Optional repository variable, e.g. Star-Pie/StarPie; defaults to this repository.
          ATOMGIT_REPOSITORY: ${{ vars.ATOMGIT_REPOSITORY || github.repository }}
        run: node .github/scripts/sync-atomgit-release.mjs
