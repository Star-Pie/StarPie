name: Verify AtomGit mirror

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      audit_releases:
        description: Compare published releases and attachments on both platforms
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source:
    if: github.ref == 'refs/heads/main' && github.repository_owner == 'Star-Pie'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compare public GitHub and AtomGit main commits
        env:
          ATOMGIT_REPOSITORY: ${{ vars.ATOMGIT_REPOSITORY || github.repository }}
        run: bash .github/scripts/sync-atomgit-main.sh

      - name: Inspect native Pull status after a manual mismatch
        if: failure() && github.event_name == 'workflow_dispatch'
        env:
          ATOMGIT_REPOSITORY: ${{ vars.ATOMGIT_REPOSITORY || github.repository }}
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          [[ "$ATOMGIT_REPOSITORY" =~ ^[[:alnum:]_.-]+/[[:alnum:]_.-]+$ ]] || exit 1
          curl --silent --show-error --fail --max-time 30 -H @- \
            "https://api.atomgit.com/api/v5/repos/$ATOMGIT_REPOSITORY/repo_remote_mirror" \
            <<< "PRIVATE-TOKEN: $ATOMGIT_TOKEN" |
            jq '{mirroring_enabled, update_status, last_successful_update_at, number_of_failures}'

  releases:
    if: github.event_name == 'workflow_dispatch' && inputs.audit_releases && github.ref == 'refs/heads/main' && github.repository_owner == 'Star-Pie'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Audit published releases and attachments
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          ATOMGIT_REPOSITORY: ${{ vars.ATOMGIT_REPOSITORY || github.repository }}
        run: node .github/scripts/audit-atomgit-releases.mjs
